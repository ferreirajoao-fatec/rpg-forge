<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <filter id="f-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{primary-deep}" flood-opacity="0.6"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="f-metal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{metal-deep}" flood-opacity="0.6"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <g data-anchor="torso">
      <g id="drapeL">
        <path fill="#{primary}" stroke="#{primary-deep}" stroke-width="1" filter="url(#f-primary)" d="M238 180 C226 186 208 189 192 192 C175 197 162 209 157 226 C153 240 152 258 152 276 C162 268 174 256 184 244 C198 226 214 208 236 194 Z"/>
        <path fill="none" stroke="#{primary-deep}" stroke-width="0.8" opacity="0.45" d="M196 200 C184 214 172 236 162 262 M214 196 C202 210 190 228 178 252"/>
        <path fill="#{primary-light}" stroke="none" opacity="0.4" filter="url(#soft2)" d="M206 192 C190 196 176 206 168 220 C180 210 194 202 210 198 Z"/>
      </g>
      <use href="#drapeL" transform="matrix(-1 0 0 1 512 0)"/>
      <path fill="none" stroke="#{metal-deep}" stroke-width="1.4" d="M240 198 C248 202 264 202 272 198"/>
      <path fill="none" stroke="#{metal}" stroke-width="0.8" stroke-dasharray="1.4 0.8" d="M240 198 C248 202 264 202 272 198"/>
      <path fill="#{metal}" stroke="#{metal-deep}" stroke-width="1" filter="url(#f-metal)" d="M234 196 m-6 0 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0"/>
      <path fill="#{metal}" stroke="#{metal-deep}" stroke-width="1" filter="url(#f-metal)" d="M278 196 m-6 0 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0"/>
      <circle fill="#{metal-light}" opacity="0.8" cx="232.4" cy="194.2" r="1.6"/><circle fill="#{metal-light}" opacity="0.8" cx="276.4" cy="194.2" r="1.6"/>
    </g>
  </g>
</svg>
