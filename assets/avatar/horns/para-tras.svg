<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <filter id="form" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{horn-deep}" flood-opacity="0.6"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <g id="hornL" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#{horn}" stroke="#{horn-deep}" stroke-width="0.9" filter="url(#form)" d="M238 82 C232 74 224 66 214 62 C204 58 194 58 186 62 C196 62 206 66 214 72 C220 78 226 86 230 94 Z"/>
    <path fill="none" stroke="#{horn-deep}" stroke-width="0.6" opacity="0.55" d="M232 80 L227 87 M224 72 L219 80 M214 66 L210 73 M202 61 L200 66"/>
    <path fill="#{horn-light}" opacity="0.6" filter="url(#soft)" d="M226 72 C218 66 208 62 196 61 C206 63 216 68 224 76 Z"/>
  </g>
  <use href="#hornL" transform="matrix(-1 0 0 1 512 0)"/>
</svg>
