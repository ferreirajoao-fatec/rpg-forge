<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <filter id="f-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{primary-deep}" flood-opacity="0.6"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <rect fill="#000000" opacity="0.28" filter="url(#soft3)" transform="translate(6 6)" x="108" y="314" width="98" height="170" rx="8"/>
    <rect fill="#{primary}" stroke="#{primary-deep}" stroke-width="1.4" filter="url(#f-primary)" x="108" y="314" width="98" height="170" rx="8"/>
    <rect fill="#{metal}" stroke="#{metal-deep}" stroke-width="1.2" x="122" y="330" width="70" height="24" rx="3"/>
    <rect fill="#9fc2d4" stroke="#{metal-deep}" stroke-width="0.8" opacity="0.7" x="126" y="334" width="62" height="16" rx="2"/>
    <rect fill="#{secondary}" stroke="#{secondary-deep}" stroke-width="0.9" x="120" y="370" width="74" height="14" rx="2"/>
    <path fill="none" stroke="#{primary-deep}" stroke-width="1.1" d="M120 400 H194 M120 460 H194"/>
    <circle fill="#{metal}" cx="118" cy="324" r="2.2"/>
    <circle fill="#{metal}" cx="196" cy="324" r="2.2"/>
    <circle fill="#{metal}" cx="118" cy="474" r="2.2"/>
    <circle fill="#{metal}" cx="196" cy="474" r="2.2"/>
  </g>
</svg>
