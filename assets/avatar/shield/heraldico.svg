    <path fill="none" stroke="#{metal-deep}" stroke-width="0.7" d="M105.8 331.8 L210.2 331.8 C211.3 350 211.3 366 210.2 380.4 C208 420 187 449 158 466.6 C129 449 108 420 105.8 380.4 C104.7 366 104.7 350 105.8 331.8 Z"/>
