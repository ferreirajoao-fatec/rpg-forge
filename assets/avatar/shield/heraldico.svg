<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <filter id="f-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{primary-deep}" flood-opacity="0.6"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="f-secondary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{secondary-deep}" flood-opacity="0.6"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="f-metal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{metal-deep}" flood-opacity="0.6"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <path fill="#000000" opacity="0.25" filter="url(#soft3)" transform="translate(6 6)" d="M108 334 L208 334 C209 350 209 366 208 380 C206 418 186 446 158 464 C130 446 110 418 108 380 C107 366 107 350 108 334 Z"/>
    <clipPath id="field"><path d="M108 334 L208 334 C209 350 209 366 208 380 C206 418 186 446 158 464 C130 446 110 418 108 380 C107 366 107 350 108 334 Z"/></clipPath>
    <path fill="#{primary}" stroke="#{primary-deep}" stroke-width="1" filter="url(#f-primary)" d="M108 334 L208 334 C209 350 209 366 208 380 C206 418 186 446 158 464 C130 446 110 418 108 380 C107 366 107 350 108 334 Z"/>
    <g clip-path="url(#field)">
      <path fill="#{secondary}" stroke="#{secondary-deep}" stroke-width="0.8" d="M100 420 L158 368 L216 420 L216 444 L158 392 L100 444 Z"/>
      <path fill="#{secondary}" stroke="#{secondary-deep}" stroke-width="0.8" d="M158 348 L166 360 L158 372 L150 360 Z"/>
