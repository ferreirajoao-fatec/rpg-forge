<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{primary-deep}" flood-opacity="0.55"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="wingL" stroke-linejoin="round" stroke-linecap="round">
    <g filter="url(#glow)" opacity="0.9">
      <path fill="#{primary}" fill-opacity="0.35" stroke="#{primary-deep}" stroke-width="0.9" d="M232 228 C210 190 180 140 140 104 C112 80 82 82 76 104 C70 130 96 168 132 194 C166 218 200 230 232 236 Z"/>
      <path fill="#{primary}" fill-opacity="0.3" stroke="#{primary-deep}" stroke-width="0.9" d="M232 244 C206 250 176 266 154 292 C134 318 132 346 148 352 C166 358 192 336 210 306 C222 286 230 264 232 244 Z"/>
    </g>
    <path fill="none" stroke="#{primary-deep}" stroke-width="0.6" opacity="0.6" d="M230 230 C200 196 166 150 120 110 M200 214 C170 190 140 160 104 140 M176 170 C150 156 120 140 96 120 M230 246 C200 270 176 300 156 338 M214 270 C196 292 176 318 162 344"/>
    <path fill="#{primary-light}" stroke="none" opacity="0.55" filter="url(#soft)" d="M150 118 C120 98 96 98 90 110 C110 108 132 118 150 134 Z"/>
  </g>
  <use href="#wingL" transform="matrix(-1 0 0 1 512 0)"/>
</svg>
