<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{primary-deep}" flood-opacity="0.55"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="soft4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="wingL" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#{primary}" stroke="#{primary-deep}" stroke-width="0.9" filter="url(#f)" opacity="0.96" d="M226 236 C200 200 168 160 132 128 C100 130 66 148 40 178 C56 196 64 220 66 250 C82 256 96 270 104 290 C116 290 130 298 140 314 C156 300 176 296 196 302 C206 290 216 280 226 272 Z"/>
    <path fill="#{primary-deep}" stroke="none" opacity="0.35" filter="url(#soft4)" d="M132 128 C126 180 120 240 104 290 C116 290 130 298 140 314 C150 260 146 190 132 128 Z"/>
    <path fill="#{primary-light}" stroke="none" opacity="0.25" filter="url(#soft4)" d="M200 226 C170 196 130 170 80 176 C120 186 160 210 186 240 Z"/>
    <path fill="none" stroke="#{primary-deep}" stroke-width="3" d="M226 236 C200 200 168 160 132 128"/>
    <path fill="none" stroke="#{primary-deep}" stroke-width="1.8" d="M132 128 L40 178 M132 128 C110 170 86 210 66 250 M132 128 C126 190 116 246 104 290 M132 128 C140 196 142 258 140 314"/>
    <path fill="none" stroke="#{primary-light}" stroke-width="0.7" opacity="0.6" d="M224 232 C198 198 166 158 132 126"/>
    <path fill="#{primary-deep}" stroke="none" d="M129 122 L134 110 L137 124 Z"/>
  </g>
  <use href="#wingL" transform="matrix(-1 0 0 1 512 0)"/>
</svg>
