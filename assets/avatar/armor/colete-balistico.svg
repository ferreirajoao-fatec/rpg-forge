      <path fill="#{primary-light}" stroke="#{primary-deep}" stroke-width="0.9" d="M222 246 L290 246 L294 310 L218 310 Z"/>
      <rect fill="#{secondary}" stroke="#{secondary-deep}" stroke-width="0.8" filter="url(#f-secondary)" x="212" y="320" width="26" height="44" rx="3"/>
      <rect fill="#{secondary}" stroke="#{secondary-deep}" stroke-width="0.8" filter="url(#f-secondary)" x="243" y="324" width="26" height="40" rx="3"/>
      <rect fill="#{secondary}" stroke="#{secondary-deep}" stroke-width="0.8" filter="url(#f-secondary)" x="274" y="320" width="26" height="44" rx="3"/>
      <path fill="none" stroke="#{primary-deep}" stroke-width="0.9" opacity="0.65" d="M220 264 L292 264 M220 282 L292 282 M220 300 L292 300"/>
      <rect fill="#{metal}" stroke="#{metal-deep}" stroke-width="0.7" x="218" y="206" width="14" height="8" rx="1"/>
      <rect fill="#{metal}" stroke="#{metal-deep}" stroke-width="0.7" x="280" y="206" width="14" height="8" rx="1"/>
    </g>
