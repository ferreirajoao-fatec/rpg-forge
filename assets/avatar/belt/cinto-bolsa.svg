      <path fill="none" stroke="#{primary-deep}" stroke-width="0.5" opacity="0.6" stroke-dasharray="2 1.4" d="M191 375.5 C212 380 234 381.5 256 381.5 C278 381.5 300 380 321 375.5 M191 387 C212 391.5 234 393 256 393 C278 393 300 391.5 321 387"/>
      <rect fill="none" stroke="#{metal}" stroke-width="3" x="246" y="374" width="20" height="26" rx="3"/>
      <rect fill="none" stroke="#{metal-deep}" stroke-width="0.6" x="244.4" y="372.4" width="23.2" height="29.2" rx="4"/>
      <path fill="none" stroke="#{metal}" stroke-width="2" d="M256 376 L256 398"/>
      <path fill="none" stroke="#{metal-light}" stroke-width="0.8" d="M247.6 376 L247.6 384"/>
