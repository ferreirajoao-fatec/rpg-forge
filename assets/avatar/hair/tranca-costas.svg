<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768">
  <defs>
    <filter id="form" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#{hair-deep}" flood-opacity="0.65"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.5"/></filter>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path fill="#{hair}" stroke="#{hair-deep}" stroke-width="0.9" filter="url(#form)" d="M218 100 C210 120 208 140 210 156 L222 156 C220 136 222 116 226 104 Z"/>
    
    
    
  </g>
</svg>
