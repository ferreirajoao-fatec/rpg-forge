name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rpg_forge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/rpg_forge_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências (gera o cliente do Prisma)
        run: pnpm install --frozen-lockfile
      - name: Aplicar migrações num banco vazio
        run: pnpm exec prisma migrate deploy
      - name: Importar o pacote de conteúdo (valida e prepara o banco para os testes de tela)
        run: pnpm content:import content/tormenta20-2020/pack.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Instalar o navegador dos testes de tela
        run: pnpm --filter @rpg-forge/web exec playwright install --with-deps chromium
      - name: Testes de tela (Playwright)
        run: pnpm test:e2e
      - name: Guardar rastros dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rastros
          path: apps/web/test-results/
          retention-days: 7

  # Deploy feito pelo Actions com o token do dono do projeto na Vercel. No plano Hobby a
  # Vercel bloqueia deploys de repositório privado quando o autor do commit não é o dono;
  # assim qualquer colaborador do GitHub publica. A integração Git da Vercel fica desligada
  # em apps/web/vercel.json para não haver deploy em dobro.
  deploy:
    needs: verificar
    # PRs de fork não recebem os secrets; só deploya push na main e PRs deste repositório.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # O build roda na Vercel (mesma região, variáveis e OIDC de sempre); o runner só envia o código.
      - name: Publicar na Vercel
        id: publicar
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then ALVO="--prod"; else ALVO=""; fi
          URL=$(npx --yes vercel@latest deploy $ALVO --yes --token "$VERCEL_TOKEN" \
            --meta githubCommitSha=${{ github.sha }} \
            --meta githubCommitAuthorLogin=${{ github.actor }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Publicado em $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Comentar o link de pré-visualização no PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --edit-last --create-if-none \
            --body "Pré-visualização na Vercel: ${{ steps.publicar.outputs.url }} (commit ${{ github.sha }})"
