name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rpg_forge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/rpg_forge_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências (gera o cliente do Prisma)
        run: pnpm install --frozen-lockfile
      - name: Aplicar migrações num banco vazio
        run: pnpm exec prisma migrate deploy
      - name: Importar o pacote de conteúdo (valida e prepara o banco para os testes de tela)
        run: pnpm content:import content/tormenta20-2020/pack.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Instalar o navegador dos testes de tela
        run: pnpm --filter @rpg-forge/web exec playwright install --with-deps chromium
      - name: Testes de tela (Playwright)
        run: pnpm test:e2e
      - name: Guardar rastros dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rastros
          path: apps/web/test-results/
          retention-days: 7
